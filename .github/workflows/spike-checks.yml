name: Spike checks
on:
  push:
    branches: [main, 'spike/**']
  pull_request:
permissions:
  contents: read
jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install fastapi==0.133.1 pydantic==2.13.4
      - name: Isolated service and pre-commit regression checks
        run: python3 -B -W error::ResourceWarning -m unittest discover -s spikes/001-cross-client-learning/tests -v
      - name: Frontend recovery regressions
        run: node spikes/001-cross-client-learning/tests/check_recovery.cjs
      - name: Python syntax
        run: python3 -m compileall -q spikes/001-cross-client-learning
      - name: Dashboard and desktop JavaScript syntax
        run: |
          node --check spikes/001-cross-client-learning/plugin/dashboard/dist/index.js
          node --check spikes/001-cross-client-learning/plugin/desktop/plugin.js
